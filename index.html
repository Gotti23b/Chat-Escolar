<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat grupal experimental en tiempo real">
  <title>Chat Grupal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="Chat Grupal">
      <header class="chat-header">
        <div>
          <h1>💬 Chat Grupal</h1>
          <p id="connectionStatus" class="status status-offline">🔴 Desconectado</p>
        </div>
        <div class="header-actions">
          <button id="memeButton" class="secondary-button" type="button" disabled>😂 Memes</button>
          <button id="changeNameButton" class="secondary-button" type="button">Cambiar nombre</button>
        </div>
      </header>

      <div id="namePanel" class="name-panel">
        <form id="nameForm" class="name-form">
          <label for="nameInput">¿Cómo te llamás?</label>
          <div class="name-row">
            <input id="nameInput" name="name" type="text" maxlength="24"
                   autocomplete="nickname" placeholder="Gotti23b" required>
            <button type="submit">Entrar</button>
          </div>
          <p class="hint">Tu nombre se guarda solamente en este navegador.</p>
        </form>
      </div>

      <section id="chatPanel" class="chat-panel hidden">
        <div id="messages" class="messages" aria-live="polite" aria-label="Mensajes del chat"></div>

        <form id="messageForm" class="message-form">
          <label class="sr-only" for="messageInput">Mensaje</label>
          <input id="messageInput" name="message" type="text" maxlength="500"
                 autocomplete="off" placeholder="Escribí un mensaje..." disabled>
          <button id="sendButton" type="submit" disabled>Enviar</button>
        </form>
        <p id="errorMessage" class="error-message" role="alert"></p>
      </section>
    </section>

    <dialog id="memeDialog" class="meme-dialog">
      <div class="meme-dialog-header">
        <h2>😂 Elegí un meme</h2>
        <button id="closeMemeButton" class="secondary-button" type="button">Cerrar</button>
      </div>
      <p class="hint">Se genera con Memegen y se manda como imagen al chat.</p>
      <div class="meme-grid" id="memeGrid"></div>
    </dialog>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
